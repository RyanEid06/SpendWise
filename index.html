<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05080c" />
    <title>SpendWise</title>
    <meta name="description" content="Offline personal expense tracker and monthly budget planner with category breakdowns and financial insights." />
    <meta property="og:title" content="SpendWise" />
    <meta property="og:description" content="Offline personal expense tracker and monthly budget planner with category breakdowns and financial insights." />
    <meta property="og:type" content="website" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f8fafc; color: #0f172a; }
      html.dark body { background: #05080c; color: #f1f5f9; }
    </style>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('spendwise_theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = saved === 'DARK' || (saved !== 'LIGHT' && systemDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          document.documentElement.classList.toggle(
            'dark',
            window.matchMedia('(prefers-color-scheme: dark)').matches
          );
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#05080C] dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
