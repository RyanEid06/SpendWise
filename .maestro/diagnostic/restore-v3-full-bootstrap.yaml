appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Restore backup.*"
- tapOn: "wp32-full.swb3"
- assertVisible: "Unlock encrypted backup"
- tapOn: "Backup password"
- inputText: "wp32-public-fixture-passphrase"
- pressKey: enter
- extendedWaitUntil:
    visible: "Backup restore"
    timeout: 30000
- tapOn:
    text: "Replace"
    index: 0
- tapOn:
    text: "Replace"
    index: 1
- extendedWaitUntil:
    visible: "Backup restored: 2 expenses, 9 photos"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "Home"
