appId: com.spendwise.app
---
- addMedia:
    - "../../tests/fixtures/media/wp32-photo-01.jpg"
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- tapOn: "Attach Photos.*"
- swipe:
    start: 50%, 76%
    end: 50%, 45%
    duration: 500
- tapOn: "Choose Photo"
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    index: 0
- tapOn:
    id: "com.google.android.providers.media.module:id/button_add"
- extendedWaitUntil:
    visible: "Attach Photos · 1"
    timeout: 30000
- extendedWaitUntil:
    visible: "Unfinished expense protected"
    timeout: 30000
