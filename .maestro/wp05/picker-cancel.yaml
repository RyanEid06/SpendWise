appId: com.spendwise.app
---
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- tapOn: "Attach Photos.*"
- swipe:
    start: 50%, 76%
    end: 50%, 45%
    duration: 500
- tapOn: "Choose Photo"
- pressKey: back
# Immediate App Lock may require authentication after leaving the picker.
- runFlow:
    when:
      visible: "Use PIN"
    file: ../helpers/android-device-pin.yaml
- extendedWaitUntil:
    visible: "Add Expense"
    timeout: 30000
- assertVisible: "Unfinished expense protected"
