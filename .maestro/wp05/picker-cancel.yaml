appId: com.spendwise.app
---
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- swipe:
    start: 50%, 74%
    end: 50%, 34%
    duration: 600
- tapOn: "Attach Photos.*"
- swipe:
    start: 50%, 76%
    end: 50%, 45%
    duration: 500
- tapOn: "Choose Photo"
- pressKey: back
# This gate configures immediate App Lock. Android's observed credential screen
# opens the PIN input directly, without a "Use PIN" biometric choice.
- runFlow: ../helpers/android-device-pin.yaml
- extendedWaitUntil:
    visible: "Add Expense"
    timeout: 30000
- assertVisible: "Unfinished expense protected"
