appId: com.spendwise.app
---
- extendedWaitUntil:
    visible: 'WP05 Native Recovery, \$37\.25'
    timeout: 30000
- assertNotVisible: "Unfinished expense protected"
- tapOn: "History"
- tapOn: "WP05 Native Recovery.*"
- assertVisible: "Attached photos"
- assertVisible: "View photos"
- extendedWaitUntil:
    visible:
      text: "View photos"
      enabled: true
    timeout: 30000
- tapOn: "View photos"
- assertVisible: "Close photo"
