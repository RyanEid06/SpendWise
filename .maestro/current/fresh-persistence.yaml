appId: com.spendwise.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../helpers/onboard-current.yaml
- tapOn: "Set Monthly Budget"
- tapOn: "Monthly Budget .*"
- inputText: "1250"
- tapOn: "Save Budget"
- tapOn: "Add Expense"
- tapOn: "Amount .*"
- inputText: "18.75"
- tapOn: "Description / Merchant .*"
- inputText: "WP32 Android Persistence"
- tapOn: "Save Expense"
- tapOn: "History"
- assertVisible: "WP32 Android Persistence"
- stopApp
- launchApp
- assertVisible: "WP32 Android Persistence"
- tapOn: "Home"
- assertVisible: ".*1,250.*"
