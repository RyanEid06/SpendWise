appId: com.spendwise.app
---
- launchApp
- tapOn: "AI Insights"
- assertVisible: "Analyze My Spending"
- setAirplaneMode: enabled
- tapOn: "Analyze My Spending"
- extendedWaitUntil:
    visible: "Local Statistical"
    # WebView may retain onLine=true in emulator airplane mode. Unknown
    # connectivity uses WP35.1's 90s readiness bound, plus 5s to render fallback.
    timeout: 95000
- assertVisible: ".*AI is unavailable right now.*"
- setAirplaneMode: disabled
