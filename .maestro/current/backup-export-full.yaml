appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Backup v3 · Data.*photos.*"
# Android WebView accessibility does not expose password placeholder text.
# Tapping the visible wrapped label focuses the corresponding input.
- tapOn: "Backup passphrase"
- inputText: "wp32-public-fixture-passphrase"
- tapOn: "Confirm passphrase"
- inputText: "wp32-public-fixture-passphrase"
- pressKey: enter
