appId: com.spendwise.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../helpers/onboard-current.yaml
- tapOn: "Open Settings"
- tapOn: "Backup & Restore"
- tapOn: "Import Data"
- tapOn: "wp32-v1.json"
- assertVisible: "Import Backup"
- tapOn: "Merge & Import"
- assertVisible: "Backup restored"
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- assertVisible: "WP32 Legacy Coffee"
- assertVisible: "WP32 Legacy Transit"
