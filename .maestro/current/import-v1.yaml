appId: com.spendwise.app
---
- launchApp:
    stopApp: false
    permissions:
      all: allow
- runFlow: ../helpers/onboard-current.yaml
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Import Data.*"
- tapOn: "wp32-v1.json"
- assertVisible: "Import Backup Preview"
- tapOn: "Merge & Import"
- extendedWaitUntil:
    visible: "Merge & Import: 2"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- assertVisible: "WP32 Legacy Coffee.*"
- assertVisible: "WP32 Legacy Transit.*"
