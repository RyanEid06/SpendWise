appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Import Data.*"
- tapOn: "wp32-data.swb3"
- assertVisible: "Unlock Backup v3"
- tapOn: "At least 8 characters"
- inputText: "wp32-public-fixture-passphrase"
- pressKey: enter
- extendedWaitUntil:
    visible: "Backup restore v3"
    timeout: 30000
- tapOn:
    text: "Replace"
    index: 0
- tapOn:
    text: "Replace"
    index: 1
- extendedWaitUntil:
    visible: "Backup restored"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- assertVisible: "WP32 One Photo.*"
- assertVisible: "WP32 Eight Photos.*"
- tapOn: "WP32 One Photo.*"
- assertVisible: "No photos attached"
- tapOn: "Close details"
