appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Restore backup.*"
- tapOn: "wp32-data.swb3"
- assertVisible: "Unlock encrypted backup"
- tapOn:
    id: "backup-password"
- inputText: "wp32-public-fixture-passphrase"
- pressKey: enter
- extendedWaitUntil:
    visible: "Backup restore"
    timeout: 30000
- tapOn:
    text: "Replace"
    index: 0
- tapOn:
    text: "Replace"
    index: 1
# The restore result is painted, but WebView 113 can omit the newly inserted
# banner from Android's cached accessibility tree after the modal closes.
# Reopen the section without repeating restore; the exact result remains required.
- extendedWaitUntil:
    notVisible: "Backup restore"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Backup & Restore.*"
- extendedWaitUntil:
    visible: "Backup restored: 2 expenses, 0 photos"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "Home"
- assertVisible: ".*1,250.*"
- tapOn: "History"
- assertVisible: "WP32 One Photo,.*11[.]50.*"
- assertVisible: "WP32 Eight Photos,.*88[.]00.*"
- tapOn: "WP32 One Photo.*"
- assertVisible: "No photos attached"
- tapOn: "Close details"
