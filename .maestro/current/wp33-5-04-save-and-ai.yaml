appId: com.spendwise.app
---
- tapOn: "Update Expense"
- tapOn: "History"
- assertVisible: "WP04 Native Edited.*"
- assertVisible: '.*\$16\.75.*'
- tapOn: "AI Insights"
- setAirplaneMode: enabled
- tapOn: "Analyze My Spending"
- tapOn: "Home"
- tapOn: "Statistics"
- tapOn: "Home"
- tapOn: "AI Insights"
- extendedWaitUntil:
    visible: "Local Statistical"
    # Allow the bounded 90s readiness stage when WebView cannot confirm offline.
    # Keep the fallback and continuity assertions; 5s is only rendering slack.
    timeout: 95000
- assertVisible: ".*AI is unavailable right now.*"
- setAirplaneMode: disabled
- tapOn: "Home"
