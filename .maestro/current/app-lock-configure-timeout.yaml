appId: com.spendwise.app
---
- launchApp:
    stopApp: false
- assertVisible: "Money Remaining"
- tapOn: "Open Settings"
- tapOn: "App Lock.*"
- assertVisible: "Enabled"
- tapOn: "Immediately"
# Native timeout changes require fresh Android authentication.
- runFlow: ../helpers/android-device-pin.yaml
- tapOn: "Back"
- tapOn: "Back to previous screen"
