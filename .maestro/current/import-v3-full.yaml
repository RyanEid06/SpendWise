appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore.*"
- tapOn: "Import Data.*"
- tapOn: "wp32-full.swb3"
- assertVisible: "Unlock Backup v3"
- tapOn: "Backup passphrase"
- inputText: "wp32-public-fixture-passphrase"
- pressKey: enter
- extendedWaitUntil:
    visible: "Backup restore v3"
    timeout: 30000
- tapOn:
    text: "Replace"
    index: 0
- assertVisible: "Replace fully validates and stages the backup before changing your current ledger."
- tapOn:
    text: "Replace"
    index: 1
- extendedWaitUntil:
    visible: "Backup restored"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- assertVisible: "WP32 One Photo.*"
- assertVisible: "WP32 Eight Photos.*"
- tapOn: "WP32 Eight Photos.*"
- assertVisible:
    text: "View photos"
    index: 7
- tapOn: "Close details"
- stopApp
- launchApp
- tapOn: "History"
- assertVisible: "WP32 Eight Photos.*"
