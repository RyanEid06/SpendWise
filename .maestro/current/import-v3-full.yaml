appId: com.spendwise.app
---
- launchApp
- tapOn: "Open Settings"
- tapOn: "Backup & Restore"
- tapOn: "Import Data"
- tapOn: "wp32-full.swb3"
- assertVisible: "Unlock Backup v3"
- tapOn: "At least 8 characters"
- inputText: "wp32-public-fixture-passphrase"
- hideKeyboard
- tapOn: "Unlock backup"
- assertVisible: "Backup restore v3"
- tapOn:
    text: "Replace"
    index: 0
- assertVisible: "Replace fully validates and stages the backup before changing your current ledger."
- tapOn:
    text: "Replace"
    index: 1
- assertVisible: "Backup restored"
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- assertVisible: "WP32 One Photo"
- assertVisible: "WP32 Eight Photos"
- tapOn: "WP32 Eight Photos"
- assertVisible:
    text: "View photos"
    index: 7
- tapOn: "Close details"
- stopApp
- launchApp
- tapOn: "History"
- assertVisible: "WP32 Eight Photos"
