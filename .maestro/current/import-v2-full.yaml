appId: com.spendwise.app
---
- launchApp:
    stopApp: false
    permissions:
      all: allow
- runFlow: ../helpers/onboard-current.yaml
- tapOn: "Open Settings"
- tapOn: "Backup & Restore"
- tapOn: "Import Data"
- tapOn: "wp32-v2-full.zip"
- assertVisible: "Backup restore v2"
- tapOn:
    text: "Merge"
    index: 1
- extendedWaitUntil:
    visible: "Backup restored"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to previous screen"
- tapOn: "History"
- tapOn: "WP32 V2 Full.*"
- assertVisible: "View photos"
