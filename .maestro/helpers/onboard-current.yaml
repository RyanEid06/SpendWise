appId: com.spendwise.app
---
- extendedWaitUntil:
    visible: "Set up SpendWise"
    timeout: 120000
- tapOn: "English"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Accept Terms of Use and Privacy Policy"
- scrollUntilVisible:
    element:
      text: "Finish setup"
    direction: DOWN
    timeout: 30000
- tapOn: "Finish setup"
- extendedWaitUntil:
    visible: "Money Remaining"
    timeout: 120000
