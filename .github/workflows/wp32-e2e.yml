name: WP32 E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify application build
        run: npm run verify

      - name: Run WP32 executable web suite
        run: npm run test:wp32

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wp32-playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-e2e:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      MAESTRO_VERSION: "2.11.0"

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build current debug APK
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run android:sync
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          mkdir -p artifacts/android-e2e/apks artifacts/android-e2e/fixtures
          cp android/app/build/outputs/apk/debug/app-debug.apk             artifacts/android-e2e/apks/current-debug.apk
          npx tsx scripts/wp32-generate-portable-fixtures.ts             artifacts/android-e2e/fixtures

      - name: Build v1.4 migration fixture APK
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/spendwise-v14"
          git worktree add --detach "$fixture" c0d7522192af7e07cbb1f46c3a00145e8b94a988
          pushd "$fixture"
          npm ci
          npm run build
          npm run android:sync
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          popd
          cp "$fixture/android/app/build/outputs/apk/debug/app-debug.apk"             artifacts/android-e2e/apks/v14-debug.apk

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION="2.11.0"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android black-box suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back none
          script: bash scripts/run-wp32-android-e2e.sh

      - name: Upload Android failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wp32-android-failure
          path: artifacts/android-e2e/results/
          if-no-files-found: ignore
          retention-days: 7
