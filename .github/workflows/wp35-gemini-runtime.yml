name: WP35 Gemini Runtime

on:
  workflow_dispatch:
  push:
    branches: ['wp35-02/gemini-runtime']
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/wp35*'
      - 'package*.json'
      - '.env.example'
      - '.github/workflows/wp35-gemini-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/security/**'
      - 'src/utils/api*'
      - 'src/app/hooks/useAiAnalysis.ts'
      - 'src/components/SmartCaptureCard.tsx'
      - 'src/components/ReceiptScanCard.tsx'
      - 'src/screens/StatisticsScreen.tsx'
      - 'tests/wp35*'
      - '.github/workflows/wp35-gemini-runtime.yml'

permissions:
  contents: read

jobs:
  runtime-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check patch and TypeScript/build
        run: |
          git diff --check HEAD^ HEAD
          npm run build
      - name: Runtime, security, fallback and privacy regressions
        run: npm run test:wp35:runtime
      - name: Existing browser, visual and accessibility regressions
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          npm run test:wp32
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wp35-runtime-browser-evidence
          path: test-results/
          retention-days: 7
