name: WP36 Private Signed Test APK

on:
  workflow_call:
    inputs:
      expected_source:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_source:
        description: 'Exact reviewed integration commit for the private 2.1.2/code12 test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-test-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/wp35-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate immutable source, metadata and configured endpoint
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          node <<'NODE'
          const v=require('./version.json'),p=require('./package.json'),l=require('./package-lock.json');
          if(v.versionName!=='2.1.2'||v.versionCode!==12||p.version!==v.versionName||l.version!==v.versionName||l.packages[''].version!==v.versionName) throw Error('Private candidate metadata mismatch');
          const u=new URL(process.env.VITE_API_BASE_URL);
          if(u.protocol!=='https:'||u.username||u.password||u.hostname==='127.0.0.1'||u.hostname==='localhost') throw Error('Expected configured HTTPS backend');
          NODE
      - run: npm ci
      - name: Existing synthetic security and runtime regressions
        run: node --import tsx --test tests/*.test.ts
      - name: TypeScript and production web build
        run: npm run verify
      - name: Embed nonsecret build identity
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('dist/wp35-build.json',JSON.stringify({source:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,versionName:'2.1.2',versionCode:12,variant:'private-wp36-test'},null,2)+'\n');
          NODE
      - name: Sync native application
        run: npm run android:sync
      - name: Build using permanent signing key
        working-directory: android
        env:
          SPENDWISE_KEYSTORE_BASE64: ${{ secrets.SPENDWISE_KEYSTORE_BASE64 }}
          SPENDWISE_KEYSTORE_PASSWORD: ${{ secrets.SPENDWISE_KEYSTORE_PASSWORD }}
          SPENDWISE_KEY_ALIAS: ${{ secrets.SPENDWISE_KEY_ALIAS }}
          SPENDWISE_KEY_PASSWORD: ${{ secrets.SPENDWISE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SPENDWISE_KEYSTORE_BASE64 SPENDWISE_KEYSTORE_PASSWORD SPENDWISE_KEY_ALIAS SPENDWISE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/spendwise-wp35-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SPENDWISE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          chmod +x gradlew
          SPENDWISE_KEYSTORE_PATH="$keystore" ./gradlew assembleRelease
      - name: Verify actual signed APK and record provenance
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/SpendWise-WP36-v2.1.2-test.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools_dir="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$tools_dir"
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" | tee release/signature.txt
          "$tools_dir/aapt" dump badging "$apk" > release/apk-badging.txt
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const file='SpendWise-WP36-v2.1.2-test.apk';
          const metadata=fs.readFileSync('release/apk-badging.txt','utf8').match(/^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'/m);
          if(!metadata||metadata[1]!=='com.spendwise.app'||metadata[2]!=='12'||metadata[3]!=='2.1.2') throw Error('Packaged identity mismatch');
          const signers=[...fs.readFileSync('release/signature.txt','utf8').matchAll(/^(?:Signer #\d+ |V\d+ Signer: )certificate SHA-256 digest: ([a-fA-F0-9]+)\r?$/gm)].map(m=>m[1].toLowerCase());
          const cert='e279124cd9d2cd6d4c191e2644fd71063993e42d13441a46759fa922f16d5965';
          if(!signers.length||signers.some(s=>s!==cert)) throw Error('Permanent signing identity mismatch');
          const sha256=crypto.createHash('sha256').update(fs.readFileSync('release/'+file)).digest('hex');
          const receipt={package:metadata[1],versionName:metadata[3],versionCode:Number(metadata[2]),source:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,variant:'private-wp36-test',apkSha256:sha256,signingCertificateSha256:cert,apiBaseUrl:process.env.VITE_API_BASE_URL};
          fs.writeFileSync('release/build-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          fs.writeFileSync('release/SHA256SUMS',sha256+'  '+file+'\n');
          NODE
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
      - name: Upload private test artifact only
        uses: actions/upload-artifact@v7
        with:
          name: SpendWise-WP36-test-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
