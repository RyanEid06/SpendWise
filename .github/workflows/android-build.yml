name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'maintenance/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_ACCESS_TOKEN: ${{ secrets.VITE_API_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for high severity
        run: npm audit --audit-level=high

      - name: Verify web app
        run: npm run verify

      - name: Run AI reliability tests
        run: npm run test:reliability

      - name: Run currency defaults tests
        run: npm run test:currency

      - name: Run persistence migration tests
        run: npm run test:persistence

      - name: Run media and Backup v2 tests
        run: npm run test:media-backup

      - name: Run core UX regression tests
        run: npm run test:core-ux

      - name: Run final product freeze regression tests
        run: npm run test:final-freeze

      - name: Run WP17 core UX regression tests
        run: npm run test:wp17

      - name: Run WP18 first-run privacy security tests
        run: npm run test:wp18

      - name: Sync Capacitor Android
        run: npm run android:sync

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SpendWise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Smoke test deployed Gemini backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ] || [ -z "${VITE_API_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing VITE_API_BASE_URL or VITE_API_ACCESS_TOKEN for deployed AI smoke test."
            exit 1
          fi

          HEALTH="$(curl --silent --show-error --fail --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90             "${VITE_API_BASE_URL%/}/api/health")"
          HEALTH="$HEALTH" node -e '
            const h = JSON.parse(process.env.HEALTH || "{}");
            if (!h.ok || !h.aiConfigured || !h.accessProtected) {
              console.error("Backend health is not AI-ready:", h);
              process.exit(1);
            }
            console.log("Backend AI health ready; model:", h.model, "fallback:", h.fallbackModel || "not-deployed");
          '

          BODY='{"summary":{"totalMonthsRecorded":0,"historicalMonthlyAverage":0,"currentMonthKey":"2026-09","currentMonthTotal":0,"previousMonthTotal":null,"categoryBaselines":[],"currentMonthExpenses":[],"recurringCandidates":[]},"currencyCode":"USD","language":"en"}'
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error --retry 1 --retry-all-errors --connect-timeout 15 --max-time 90             -o "$RESPONSE_FILE" -w "%{http_code}"             -H "Content-Type: application/json"             -H "X-SpendWise-Token: ${VITE_API_ACCESS_TOKEN}"             --data "$BODY"             "${VITE_API_BASE_URL%/}/api/gemini/analyze")"
          node - "$HTTP_STATUS" "$RESPONSE_FILE" <<'NODE'
          const fs = require('fs');
          const status = Number(process.argv[2] || 0);
          const responseFile = process.argv[3];
          const body = fs.readFileSync(responseFile, 'utf8');
          let r = {};
          try { r = JSON.parse(body); } catch {}
          if (status < 200 || status >= 300) {
            console.error("Gemini smoke failed:", status, {
              error: r.error,
              message: r.message,
            });
            process.exit(1);
          }
          if (r.isAiGenerated !== true || typeof r.spendingOverview !== "string") {
            console.error("Gemini smoke response was not valid JSON.");
            process.exit(1);
          }
          console.log("Live Gemini smoke test passed.");
          NODE
          rm -f "$RESPONSE_FILE"


  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_ACCESS_TOKEN: ${{ secrets.VITE_API_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag and version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8'));process.stdout.write(v.versionName)")"
          VERSION_CODE="$(node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8'));process.stdout.write(String(v.versionCode))")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.json (v$VERSION_NAME)."
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building SpendWise $VERSION_NAME (build $VERSION_CODE)"

      - name: Validate signing secrets
        shell: bash
        env:
          SPENDWISE_KEYSTORE_BASE64: ${{ secrets.SPENDWISE_KEYSTORE_BASE64 }}
          SPENDWISE_KEYSTORE_PASSWORD: ${{ secrets.SPENDWISE_KEYSTORE_PASSWORD }}
          SPENDWISE_KEY_ALIAS: ${{ secrets.SPENDWISE_KEY_ALIAS }}
          SPENDWISE_KEY_PASSWORD: ${{ secrets.SPENDWISE_KEY_PASSWORD }}
        run: |
          missing=0
          for var in SPENDWISE_KEYSTORE_BASE64 SPENDWISE_KEYSTORE_PASSWORD SPENDWISE_KEY_ALIAS SPENDWISE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository Actions secret: $var"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        shell: bash
        env:
          SPENDWISE_KEYSTORE_BASE64: ${{ secrets.SPENDWISE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SPENDWISE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendwise-release.jks"
          chmod 600 "$RUNNER_TEMP/spendwise-release.jks"

      - name: Verify web app
        run: npm run verify

      - name: Sync Capacitor Android
        run: npm run android:sync

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          SPENDWISE_KEYSTORE_PATH: ${{ runner.temp }}/spendwise-release.jks
          SPENDWISE_KEYSTORE_PASSWORD: ${{ secrets.SPENDWISE_KEYSTORE_PASSWORD }}
          SPENDWISE_KEY_ALIAS: ${{ secrets.SPENDWISE_KEY_ALIAS }}
          SPENDWISE_KEY_PASSWORD: ${{ secrets.SPENDWISE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Prepare versioned APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/SpendWise-v${{ steps.version.outputs.version }}.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: SpendWise-v${{ steps.version.outputs.version }}-release
          path: release/SpendWise-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: release/SpendWise-v${{ steps.version.outputs.version }}.apk
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --verify-tag \
              --title "SpendWise $GITHUB_REF_NAME" \
              --generate-notes
          fi